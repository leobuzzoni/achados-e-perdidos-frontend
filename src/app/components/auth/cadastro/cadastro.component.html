<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="text-center mb-4">
        <h1 class="fw-bold">Criar conta</h1>
        <p class="text-secondary">Cadastre-se para publicar e acompanhar objetos.</p>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
          <div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>

          <form [formGroup]="form" (ngSubmit)="cadastrar()">
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input class="form-control" formControlName="name">
            </div>

            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" formControlName="email">
            </div>

            <div class="mb-4">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control" formControlName="password">
              <div class="form-text">Mínimo de 6 caracteres.</div>
            </div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="carregando">
              {{ carregando ? 'Criando conta...' : 'Criar conta' }}
            </button>
          </form>

          <p class="text-center text-secondary mt-4 mb-0">
            Já possui conta? <a routerLink="/login">Entrar</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
