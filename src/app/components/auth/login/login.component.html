<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="text-center mb-4">
        <h1 class="fw-bold">Entrar</h1>
        <p class="text-secondary">Acesse sua conta do Achados & Perdidos.</p>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
          <div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>

          <form [formGroup]="form" (ngSubmit)="entrar()">
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" formControlName="email">
              <div class="invalid-feedback d-block" *ngIf="form.controls.email.touched && form.controls.email.invalid">
                Informe um e-mail válido.
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control" formControlName="password">
              <div class="invalid-feedback d-block" *ngIf="form.controls.password.touched && form.controls.password.invalid">
                Informe sua senha.
              </div>
            </div>

            <button class="btn btn-primary w-100" type="submit" [disabled]="carregando">
              {{ carregando ? 'Entrando...' : 'Entrar' }}
            </button>
          </form>

          <p class="text-center text-secondary mt-4 mb-0">
            Ainda não possui conta?
            <a routerLink="/cadastro">Cadastre-se</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
